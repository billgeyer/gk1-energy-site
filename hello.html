<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GK1 Energy · Bill Geyer</title>
<link rel="icon" type="image/svg+xml" href="./images/gk1-icon-navy-bg.svg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dusk:#10182c;
    --bg-panel:#182446;
    --sun:#f2a33b;
    --sun-dim:#c9832c;
    --sky:#7fb0be;
    --text-hi:#eef0f6;
    --text-mid:#a4adc4;
    --text-low:#6d7896;
    --line:rgba(255,255,255,0.09);
    --radius:14px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg-dusk); color:var(--text-hi);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.55;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--sun); outline-offset:3px; border-radius:4px; }
  .card{ width:100%; max-width:380px; text-align:center; }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:0.72rem; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--sky); margin-bottom:18px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; margin:0;
    font-size:2rem; color:var(--text-hi);
  }
  .subhead{ margin:16px 0 32px; color:var(--text-mid); font-size:1.02rem; }
  .btn-primary{
    display:block; background:var(--sun); color:#1a1300; font-weight:600; padding:16px 24px;
    border-radius:999px; text-decoration:none; font-size:1.02rem; border:1px solid var(--sun);
  }
  .btn-primary:hover{ background:#ffb54e; }
  .btn-ghost{
    display:block; color:var(--text-hi); border:1px solid var(--line); padding:16px 24px;
    border-radius:999px; text-decoration:none; font-size:1.02rem; margin-top:14px;
  }
  .btn-ghost:hover{ border-color:var(--sky); }
  .footnote{
    margin-top:28px; font-family:'IBM Plex Mono',monospace; font-size:0.72rem;
    color:var(--text-low); letter-spacing:0.04em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">BILL GEYER · GK1 ENERGY</div>
    <h1>Thanks for connecting.</h1>
    <p class="subhead">Save my contact info or request a free consultation below.</p>
    <a class="btn-primary" href="./bill-geyer.vcf">Save my contact info</a>
    <a class="btn-ghost" id="consultLink" href="./index.html#contact">Request a consultation</a>
    <p class="footnote">Serving New England &amp; the East End of Long Island</p>
  </div>
  <script>
    const ref = new URLSearchParams(window.location.search).get('ref');
    if (ref){
      document.getElementById('consultLink').href = './index.html?ref=' + encodeURIComponent(ref) + '#contact';
    }
  </script>
</body>
</html>
